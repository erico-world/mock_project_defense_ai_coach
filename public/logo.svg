<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Dark mode colors (default) */
    .background { fill: #171532; }
    .circuit-lines { stroke: #40E0D0; }
    .circuit-nodes { fill: #A0E8E8; }
    .cap { fill: #40E0D0; }
    .cap-stroke { stroke: #40E0D0; }
    .eye-fill { fill: #171532; }
    .eye-stroke { stroke: #171532; }
    
    /* Light mode colors */
    @media (prefers-color-scheme: light) {
      .background { fill: #40E0D0; }
      .circuit-lines { stroke: #171532; }
      .circuit-nodes { fill: #171532; }
      .cap { fill: #171532; }
      .cap-stroke { stroke: #171532; }
      .eye-fill { fill: #40E0D0; }
      .eye-stroke { stroke: #40E0D0; }
    }
  </style>
  
  <!-- Brain circuit background (represents AI) -->
  <circle cx="20" cy="20" r="18" class="background" />
  
  <!-- Circuit lines -->
  <path d="M12 16C12 16 18 10 28 16" class="circuit-lines" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M10 20C10 20 18 26 30 20" class="circuit-lines" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M12 24C12 24 20 18 28 24" class="circuit-lines" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Circuit nodes -->
  <circle cx="12" cy="16" r="1.5" class="circuit-nodes"/>
  <circle cx="28" cy="16" r="1.5" class="circuit-nodes"/>
  <circle cx="10" cy="20" r="1.5" class="circuit-nodes"/>
  <circle cx="30" cy="20" r="1.5" class="circuit-nodes"/>
  <circle cx="12" cy="24" r="1.5" class="circuit-nodes"/>
  <circle cx="28" cy="24" r="1.5" class="circuit-nodes"/>
  
  <!-- Graduation cap (represents coaching and education) -->
  <path d="M20 8L30 14L20 20L10 14L20 8Z" class="cap" />
  <path d="M30 14V21" class="cap-stroke" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 16V21C14 21 17 24 20 24C23 24 26 21 26 21V16" class="cap-stroke" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="30" cy="22" r="1" class="cap"/>
  
  <!-- Digital eye (represents AI vision) -->
  <circle cx="20" cy="14" r="2" class="eye-fill"/>
  <path d="M18 14H22" class="eye-stroke" stroke-width="1" stroke-linecap="round"/>
  <path d="M20 12V16" class="eye-stroke" stroke-width="1" stroke-linecap="round"/>
</svg>
